name: Validate SkillVerse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Ensure catalog is committed
        run: git diff --exit-code -- catalog/skills.json
      - uses: actions/upload-artifact@v4
        with:
          name: skillverse-site
          path: dist

